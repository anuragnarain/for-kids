<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sort by Size 📏</title>
<style>
  :root{
    --bg1:#e8f5e9; --bg2:#fff8e1; --bg3:#e3f2fd;
    --card:#ffffff; --ink:#33324a; --good:#2fbf87; --sel:#ffd23f;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; overscroll-behavior:none; }
  body{
    font-family:"Comic Sans MS","Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    background-attachment:fixed;
    overflow:hidden; user-select:none; touch-action:manipulation;
    display:flex; flex-direction:column; align-items:center;
    height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button{ touch-action:manipulation; font-family:inherit; }

  /* ---- Top bar ---- */
  #topbar{ width:100%; max-width:640px; padding:12px 20px;
    display:flex; justify-content:space-between; align-items:center; gap:12px; }
  #stars{ background:rgba(255,255,255,.85); border-radius:999px; padding:8px 18px;
    font-size:clamp(20px,5vw,30px); font-weight:800; display:flex; align-items:center; gap:6px;
    box-shadow:0 4px 0 rgba(0,0,0,.12); }
  #stars.pop{ animation:pop .5s ease; }
  #speaker{ background:rgba(255,255,255,.85); border:none; border-radius:999px;
    width:clamp(50px,12vw,60px); height:clamp(50px,12vw,60px); font-size:clamp(22px,6vw,30px);
    cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.12); }
  #speaker:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.12); }
  .tb-left{ display:flex; align-items:center; gap:10px; }
  .homeBtn{ background:rgba(255,255,255,.85); border-radius:999px;
    width:clamp(46px,11vw,58px); height:clamp(46px,11vw,58px);
    display:flex; align-items:center; justify-content:center; font-size:clamp(22px,5.5vw,28px);
    text-decoration:none; box-shadow:0 4px 0 rgba(0,0,0,.12); }
  .homeBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.12); }

  /* ---- Direction pill ---- */
  #direction{
    text-align:center; padding:0 16px clamp(2px,0.8vh,6px);
    font-size:clamp(13px,3.5vw,18px); font-weight:800; color:#5a5a78;
  }

  /* ---- Hint ---- */
  #hint{ color:#3a3a5a; font-weight:800; text-align:center; padding:0 16px clamp(4px,1vh,8px);
    font-size:clamp(17px,4.8vw,26px); text-shadow:0 1px 0 rgba(255,255,255,.4); }

  /* ---- Slots (answer area at top) ---- */
  #slots{
    display:flex; justify-content:center; align-items:flex-end; gap:clamp(6px,2vw,14px);
    padding:clamp(6px,1.5vh,14px) 16px; width:100%; max-width:500px;
  }
  .slot{
    flex:1; border-radius:20px; border:3px dashed rgba(0,0,0,.15); background:rgba(255,255,255,.3);
    display:flex; align-items:center; justify-content:center; position:relative;
    transition:border-color .2s;
  }
  .slot.next{ border-color:var(--sel); border-style:solid; background:rgba(255,210,63,.12); }
  .slot .num{ position:absolute; top:4px; left:8px; font-size:clamp(10px,2.8vw,14px);
    font-weight:800; color:rgba(0,0,0,.25); }
  .slot .placed{
    line-height:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,.12));
    animation:placeIn .35s ease;
  }
  @keyframes placeIn{ 0%{transform:scale(0);} 60%{transform:scale(1.15);} 100%{transform:scale(1);} }

  /* Size tiers for placed emoji in slots */
  .slot .placed.sz-1{ font-size:clamp(22px,6vw,34px); }
  .slot .placed.sz-2{ font-size:clamp(30px,8vw,44px); }
  .slot .placed.sz-3{ font-size:clamp(38px,10vw,54px); }
  .slot .placed.sz-4{ font-size:clamp(46px,12vw,64px); }

  /* ---- Objects to pick from ---- */
  #stage{ flex:1; width:100%; max-width:500px; display:flex; flex-direction:column;
    justify-content:center; align-items:center; padding:0 16px; min-height:0; }

  #objects{
    display:flex; flex-wrap:wrap; justify-content:center; align-items:center; align-content:center;
    gap:clamp(10px,3vw,20px); width:100%;
  }
  .obj{
    background:var(--card); border-radius:24px; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(2px,0.5vh,6px); padding:clamp(12px,3vw,20px);
    box-shadow:0 6px 0 rgba(0,0,0,.16); transition:transform .1s, box-shadow .1s, opacity .3s;
    line-height:1;
  }
  .obj:active{ transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.16); }
  .obj .em{ filter:drop-shadow(0 2px 3px rgba(0,0,0,.12)); }
  .obj .lbl{ font-size:clamp(11px,3vw,15px); font-weight:700; color:#5a5a78; }
  .obj.used{ opacity:.25; pointer-events:none; transform:scale(.85); }
  .obj.wrong{ animation:nope .4s ease; }

  /* Size tiers for objects */
  .obj.sz-1 .em{ font-size:clamp(30px,9vw,50px); }
  .obj.sz-2 .em{ font-size:clamp(40px,12vw,64px); }
  .obj.sz-3 .em{ font-size:clamp(50px,15vw,78px); }
  .obj.sz-4 .em{ font-size:clamp(60px,18vw,92px); }

  /* Slot heights match the largest tier */
  .slot{ height:clamp(50px,13vw,80px); }

  @keyframes nope{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
  @keyframes matchPop{ 0%{transform:scale(1)} 45%{transform:scale(1.12)} 100%{transform:scale(1)} }
  @keyframes pop{ 0%{transform:translate(-50%,-50%) scale(0)} 60%{transform:translate(-50%,-50%) scale(1.15)} 100%{transform:translate(-50%,-50%) scale(1)} }

  /* ---- Confetti + toast ---- */
  .confetti{ position:fixed; top:-20px; width:14px; height:14px; z-index:50; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(105dvh) rotate(720deg); } }
  #toast{ position:fixed; top:38%; left:50%; transform:translate(-50%,-50%) scale(0);
    font-size:clamp(32px,9vw,58px); font-weight:900; color:#fff; z-index:60;
    text-shadow:0 4px 0 rgba(0,0,0,.2); pointer-events:none; text-align:center; }
  #toast.show{ animation:pop .8s ease; }

  /* ---- Start screen ---- */
  #start{ position:fixed; inset:0; z-index:100;
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; text-align:center; padding:20px; }
  #start .big{ font-size:clamp(70px,22vw,130px); animation:bob 2.2s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  #start h1{ font-size:clamp(30px,8vw,52px); color:#3a3a5a; text-shadow:0 3px 0 rgba(255,255,255,.4); }
  #start p{ color:#4a4a68; font-size:clamp(15px,4vw,20px); opacity:.95; max-width:26ch; }
  #play{ background:var(--good); color:#fff; border:none; border-radius:999px;
    font-size:clamp(26px,7vw,38px); font-weight:800; padding:16px 50px; cursor:pointer; box-shadow:0 8px 0 rgba(0,0,0,.2); }
  #play:active{ transform:translateY(4px); box-shadow:0 4px 0 rgba(0,0,0,.2); }

  /* ---- Landscape ---- */
  @media (orientation:landscape) and (max-height:500px){
    #topbar{ padding:4px 14px; }
    #hint{ font-size:clamp(13px,3.4vw,18px); padding:0 12px 2px; }
    #direction{ font-size:clamp(11px,2.8vw,15px); padding:0 12px 0; }
    #stars{ padding:4px 12px; font-size:clamp(15px,3.5vw,22px); }
    #speaker{ width:38px; height:38px; font-size:18px; }
    .homeBtn{ width:38px; height:38px; font-size:18px; }
    #slots{ padding:2px 12px; }
    .slot{ height:clamp(36px,11vh,60px); }
    .slot .placed.sz-1{ font-size:clamp(16px,5vh,26px); }
    .slot .placed.sz-2{ font-size:clamp(22px,7vh,34px); }
    .slot .placed.sz-3{ font-size:clamp(28px,9vh,42px); }
    .slot .placed.sz-4{ font-size:clamp(34px,11vh,50px); }
    #stage{ padding:0 12px; }
    .obj.sz-1 .em{ font-size:clamp(22px,8vh,38px); }
    .obj.sz-2 .em{ font-size:clamp(28px,10vh,46px); }
    .obj.sz-3 .em{ font-size:clamp(34px,12vh,54px); }
    .obj.sz-4 .em{ font-size:clamp(40px,14vh,62px); }
    .obj{ padding:clamp(6px,1.5vh,12px); }
  }
</style>
</head>
<body>
  <div id="topbar">
    <div class="tb-left">
      <a class="homeBtn" href="index.html" title="Home" aria-label="Home">🏠</a>
      <div id="stars">⭐ <span id="starCount">0</span></div>
    </div>
    <button id="speaker" title="Say it again">🔊</button>
  </div>
  <div id="hint">Tap from smallest to biggest!</div>
  <div id="direction"></div>

  <div id="slots"></div>

  <div id="stage">
    <div id="objects"></div>
  </div>

  <div id="toast"></div>

  <div id="start">
    <div class="big">📏</div>
    <h1>Sort by Size!</h1>
    <p>Tap the objects in order from smallest to biggest.</p>
    <button id="play">▶ Play</button>
  </div>

<script>
(function(){
  const GROUPS = [
    { name:"Animals", sets:[
      [{e:"🐜",w:"Ant"},{e:"🐁",w:"Mouse"},{e:"🐱",w:"Cat"},{e:"🐕",w:"Dog"}],
      [{e:"🐛",w:"Bug"},{e:"🐸",w:"Frog"},{e:"🐒",w:"Monkey"},{e:"🦁",w:"Lion"}],
      [{e:"🐝",w:"Bee"},{e:"🐰",w:"Rabbit"},{e:"🦊",w:"Fox"},{e:"🐘",w:"Elephant"}],
      [{e:"🐞",w:"Ladybug"},{e:"🐿️",w:"Squirrel"},{e:"🦌",w:"Deer"},{e:"🐻",w:"Bear"}],
      [{e:"🦗",w:"Cricket"},{e:"🐦",w:"Bird"},{e:"🦆",w:"Duck"},{e:"🦒",w:"Giraffe"}],
      [{e:"🐌",w:"Snail"},{e:"🐧",w:"Penguin"},{e:"🐑",w:"Sheep"},{e:"🐄",w:"Cow"}],
      [{e:"🪲",w:"Beetle"},{e:"🐢",w:"Turtle"},{e:"🐖",w:"Pig"},{e:"🐎",w:"Horse"}],
      [{e:"🦎",w:"Lizard"},{e:"🦉",w:"Owl"},{e:"🐺",w:"Wolf"},{e:"🐋",w:"Whale"}],
      [{e:"🐜",w:"Ant"},{e:"🐔",w:"Chicken"},{e:"🐐",w:"Goat"},{e:"🦛",w:"Hippo"}],
      [{e:"🦋",w:"Butterfly"},{e:"🐠",w:"Fish"},{e:"🐬",w:"Dolphin"},{e:"🦈",w:"Shark"}],
    ]},
    { name:"Fruit", sets:[
      [{e:"🫐",w:"Blueberry"},{e:"🍓",w:"Strawberry"},{e:"🍎",w:"Apple"},{e:"🍉",w:"Watermelon"}],
      [{e:"🍒",w:"Cherry"},{e:"🍑",w:"Peach"},{e:"🥭",w:"Mango"},{e:"🍈",w:"Melon"}],
      [{e:"🫒",w:"Olive"},{e:"🍋",w:"Lemon"},{e:"🍊",w:"Orange"},{e:"🥥",w:"Coconut"}],
      [{e:"🍇",w:"Grape"},{e:"🥝",w:"Kiwi"},{e:"🍐",w:"Pear"},{e:"🍍",w:"Pineapple"}],
    ]},
    { name:"Vehicles", sets:[
      [{e:"🛴",w:"Scooter"},{e:"🚲",w:"Bicycle"},{e:"🚗",w:"Car"},{e:"🚌",w:"Bus"}],
      [{e:"🛹",w:"Skateboard"},{e:"🏍️",w:"Motorbike"},{e:"🚙",w:"SUV"},{e:"🚂",w:"Train"}],
      [{e:"🛵",w:"Moped"},{e:"🚕",w:"Taxi"},{e:"🚒",w:"Fire truck"},{e:"✈️",w:"Airplane"}],
      [{e:"🚲",w:"Bicycle"},{e:"🚗",w:"Car"},{e:"🚐",w:"Van"},{e:"🚢",w:"Ship"}],
    ]},
    { name:"Nature", sets:[
      [{e:"🌱",w:"Sprout"},{e:"🌿",w:"Herb"},{e:"🌴",w:"Palm tree"},{e:"🏔️",w:"Mountain"}],
      [{e:"💧",w:"Drop"},{e:"🌊",w:"Wave"},{e:"🏞️",w:"Lake"},{e:"🌍",w:"Earth"}],
      [{e:"🪨",w:"Pebble"},{e:"🪵",w:"Log"},{e:"🌳",w:"Tree"},{e:"🗻",w:"Volcano"}],
      [{e:"🌸",w:"Blossom"},{e:"🌻",w:"Sunflower"},{e:"🎋",w:"Bamboo"},{e:"🏝️",w:"Island"}],
    ]},
    { name:"Objects", sets:[
      [{e:"🔑",w:"Key"},{e:"📱",w:"Phone"},{e:"💻",w:"Laptop"},{e:"📺",w:"TV"}],
      [{e:"🪙",w:"Coin"},{e:"📖",w:"Book"},{e:"🧳",w:"Suitcase"},{e:"🏠",w:"House"}],
      [{e:"✏️",w:"Pencil"},{e:"📕",w:"Book"},{e:"🎒",w:"Backpack"},{e:"🛏️",w:"Bed"}],
      [{e:"💍",w:"Ring"},{e:"👟",w:"Shoe"},{e:"🪑",w:"Chair"},{e:"🚪",w:"Door"}],
      [{e:"🔩",w:"Bolt"},{e:"🔨",w:"Hammer"},{e:"🪣",w:"Bucket"},{e:"🛒",w:"Cart"}],
      [{e:"🧷",w:"Pin"},{e:"🕯️",w:"Candle"},{e:"🎸",w:"Guitar"},{e:"🛋️",w:"Couch"}],
    ]},
    { name:"Food", sets:[
      [{e:"🍚",w:"Rice grain"},{e:"🍪",w:"Cookie"},{e:"🍔",w:"Burger"},{e:"🎂",w:"Cake"}],
      [{e:"🥜",w:"Peanut"},{e:"🥚",w:"Egg"},{e:"🥖",w:"Bread"},{e:"🍕",w:"Pizza"}],
      [{e:"🍬",w:"Candy"},{e:"🧁",w:"Cupcake"},{e:"🥧",w:"Pie"},{e:"🍰",w:"Cake"}],
    ]},
    { name:"Space", sets:[
      [{e:"🪨",w:"Asteroid"},{e:"🌙",w:"Moon"},{e:"🌍",w:"Earth"},{e:"☀️",w:"Sun"}],
      [{e:"⭐",w:"Star"},{e:"🪐",w:"Planet"},{e:"🌌",w:"Galaxy"},{e:"🌀",w:"Universe"}],
    ]},
    { name:"People & Body", sets:[
      [{e:"👶",w:"Baby"},{e:"🧒",w:"Child"},{e:"🧑",w:"Teen"},{e:"👨",w:"Adult"}],
      [{e:"🦶",w:"Foot"},{e:"🤚",w:"Hand"},{e:"💪",w:"Arm"},{e:"🧍",w:"Body"}],
    ]},
    { name:"Buildings", sets:[
      [{e:"🏕️",w:"Tent"},{e:"🛖",w:"Hut"},{e:"🏠",w:"House"},{e:"🏰",w:"Castle"}],
      [{e:"⛺",w:"Tent"},{e:"🏡",w:"Cottage"},{e:"🏢",w:"Building"},{e:"🏙️",w:"City"}],
    ]},
    { name:"Balls", sets:[
      [{e:"🏓",w:"Ping pong"},{e:"🎾",w:"Tennis"},{e:"⚽",w:"Football"},{e:"🏀",w:"Basketball"}],
      [{e:"🏸",w:"Shuttle"},{e:"🥎",w:"Softball"},{e:"🏐",w:"Volleyball"},{e:"🎳",w:"Bowling"}],
    ]},
  ];

  const $ = id => document.getElementById(id);
  const slotsEl = $("slots"), objArea = $("objects"), starCountEl = $("starCount");
  const toast = $("toast"), hintEl = $("hint"), dirEl = $("direction");

  let stars = 0, locked = false, lastSpeech = "";
  let currentOrder = [], nextIdx = 0, ascending = true;

  const rnd = n => Math.floor(Math.random()*n);
  const pick = arr => arr[rnd(arr.length)];
  const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };

  // ---------- Audio ----------
  let actx = null, masterGain = null;
  function ensureAudio(){
    if(!actx){
      try{
        actx = new (window.AudioContext||window.webkitAudioContext)();
        masterGain = actx.createGain(); masterGain.gain.value = 0.85;
        const comp = actx.createDynamicsCompressor();
        masterGain.connect(comp); comp.connect(actx.destination);
      }catch(e){}
    }
    if(actx && actx.state === "suspended") actx.resume();
  }
  function tone(freq, start, dur, type, peak){
    if(!actx) return;
    const t0 = actx.currentTime + start;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak || 0.22, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  const playCorrect = () => { ensureAudio(); tone(523.25 * (1 + nextIdx * 0.15), 0, 0.25, "sine", 0.25); };
  const playWrong   = () => { ensureAudio(); tone(392,0,0.18,"sine",0.2); tone(311,0.13,0.26,"sine",0.2); };
  const playWin     = () => { ensureAudio(); [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f, i*0.12, 0.4, "sine", 0.28)); };

  // ---------- Speech ----------
  let voice = null;
  function chooseVoice(){
    if(!("speechSynthesis" in window)) return;
    const vs = speechSynthesis.getVoices(); if(!vs.length) return;
    const prefer = ["Google US English","Samantha",
      "Microsoft Aria Online (Natural) - English (United States)","Microsoft Aria",
      "Microsoft Jenny Online (Natural) - English (United States)","Microsoft Zira","Karen","Moira","Alex"];
    voice = prefer.map(n => vs.find(v => v.name === n)).find(Boolean)
         || vs.find(v => /en[-_]US/i.test(v.lang) && /google|aria|jenny|zira|samantha|female/i.test(v.name))
         || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || vs[0];
  }
  if("speechSynthesis" in window){ chooseVoice(); speechSynthesis.onvoiceschanged = chooseVoice; }
  let speakToken = 0;
  function speak(text){
    lastSpeech = text;
    if(!("speechSynthesis" in window)) return;
    const my = ++speakToken;
    try{ speechSynthesis.cancel(); }catch(e){}
    setTimeout(() => {
      if(my !== speakToken) return;
      try{
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        if(voice) u.voice = voice;
        u.rate = 0.92; u.pitch = 1.05; u.volume = 1; u.lang = (voice && voice.lang) || "en-US";
        speechSynthesis.speak(u);
      }catch(e){}
    }, 45);
  }
  $("speaker").addEventListener("click", () => { ensureAudio(); if(lastSpeech) speak(lastSpeech); });

  // ---------- Build a round ----------
  function newRound(){
    locked = false; nextIdx = 0;
    slotsEl.innerHTML = ""; objArea.innerHTML = "";

    ascending = true;
    hintEl.textContent = "Tap from smallest to biggest!";
    dirEl.textContent = "⬆️ Small → Big";

    const group = pick(GROUPS);
    const set = pick(group.sets);
    currentOrder = ascending ? [...set] : [...set].reverse();

    const SIZE_CLASSES = ["sz-1","sz-2","sz-3","sz-4"];

    for(let i = 0; i < currentOrder.length; i++){
      const slot = document.createElement("div");
      slot.className = "slot" + (i === 0 ? " next" : "");
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = i + 1;
      slot.appendChild(num);
      slotsEl.appendChild(slot);
    }

    const shuffled = shuffle(currentOrder.map((item, i) => ({...item, rank: i})));

    shuffled.forEach(item => {
      const btn = document.createElement("button");
      btn.className = "obj " + SIZE_CLASSES[item.rank];
      btn.dataset.rank = item.rank;
      btn.innerHTML = `<span class="em">${item.e}</span><span class="lbl">${item.w}</span>`;
      btn.addEventListener("click", () => tapObj(btn, item));
      objArea.appendChild(btn);
    });

    speak("Sort the " + group.name.toLowerCase() + " from smallest to biggest!");
  }

  // ---------- Tap an object ----------
  function tapObj(btn, item){
    if(locked || btn.classList.contains("used")) return;
    ensureAudio();

    const expectedRank = currentOrder[nextIdx].rank !== undefined
      ? currentOrder.indexOf(currentOrder[nextIdx])
      : nextIdx;

    if(parseInt(btn.dataset.rank) === nextIdx){
      playCorrect();
      btn.classList.add("used");
      speak(item.w + "!");

      const slots = slotsEl.querySelectorAll(".slot");
      const slot = slots[nextIdx];
      slot.classList.remove("next");
      const SIZE_CLASSES = ["sz-1","sz-2","sz-3","sz-4"];
      const placed = document.createElement("span");
      placed.className = "placed " + SIZE_CLASSES[parseInt(btn.dataset.rank)];
      placed.textContent = item.e;
      slot.appendChild(placed);

      nextIdx++;
      if(nextIdx < currentOrder.length){
        slots[nextIdx].classList.add("next");
      } else {
        locked = true;
        addStar(); burst(20);
        playWin();
        speak("Great job! You sorted them all!");
        showToast("🎉 Perfect!");
        setTimeout(newRound, 2000);
      }
    } else {
      playWrong();
      btn.classList.add("wrong");
      speak("Not quite! Find the smallest one.");
      setTimeout(() => btn.classList.remove("wrong"), 450);
    }
  }

  // ---------- Rewards ----------
  function addStar(){
    stars++; starCountEl.textContent = stars;
    const s = $("stars"); s.classList.remove("pop"); void s.offsetWidth; s.classList.add("pop");
  }
  function showToast(txt){
    toast.textContent = txt;
    toast.classList.remove("show"); void toast.offsetWidth; toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => { toast.textContent = ""; }, 1900);
  }
  const CONF = ["#ff6b6b","#ffd93d","#4dabf7","#51cf66","#ff8fab","#9775fa"];
  function burst(n){
    for(let i=0;i<n;i++){
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = rnd(100)+"vw";
      c.style.background = pick(CONF);
      c.style.borderRadius = rnd(2) ? "50%" : "2px";
      c.style.animationDuration = (1.1 + Math.random()*1.1)+"s";
      c.style.animationDelay = (Math.random()*0.25)+"s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 2600);
    }
  }

  // ---------- Start ----------
  $("play").addEventListener("click", () => {
    ensureAudio();
    $("start").style.display = "none";
    newRound();
  });
})();
</script>
</body>
</html>
